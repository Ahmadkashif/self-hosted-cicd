# lab: egress probes from a DEPLOY-lane job container (the deploy runner is registered to this repo only)
name: egress
on: [workflow_dispatch]
jobs:
  deploy-lane:
    runs-on: deploy
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: { persist-credentials: false }
      - run: ./probe.sh deploy
