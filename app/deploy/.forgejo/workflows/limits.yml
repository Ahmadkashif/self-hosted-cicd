name: limits
on: [workflow_dispatch]
jobs:
  limits:
    runs-on: deploy
    steps:
      - run: |
          echo "memory.max=$(cat /sys/fs/cgroup/memory.max) cpu.max=$(cat /sys/fs/cgroup/cpu.max) pids.max=$(cat /sys/fs/cgroup/pids.max)"
          echo "ACTIONS_CACHE_URL set: ${ACTIONS_CACHE_URL:-no (cache disabled on the deploy lane)}"
